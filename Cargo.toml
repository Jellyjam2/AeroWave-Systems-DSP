[package]
name = "titan_forge"
version = "0.1.0"
edition = "2021"

[lib]
name = "titan_forge"
crate-type = ["cdylib"]

[dependencies]
# PyO3 0.23 bridge
pyo3 = { version = "0.23", features = ["extension-module"] }
# The Parallel General (All i3 Cores)
rayon = "1.8"
# The High-Performance Rust Engine
varisat = "0.2.2"
# THE MISSING KEY: Thermal Noise for the Tunnel Strike
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"