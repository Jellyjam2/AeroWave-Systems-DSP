[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "aerowave-dsp"
version = "0.1.0"
description = "AeroWave Systems DSP - High-performance music generation engine with matrix-based composition"
authors = [
    {name = "Enrico Heinrich Leitch", email = "enrico@aerowave.systems"}
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.8"
keywords = ["audio", "dsp", "music", "cognitive", "synthesis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Only essential pillars remain
dependencies = [
    "python-sat",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
]
