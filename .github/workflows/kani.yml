name: AeroWave Kani Verification

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Kani Rust Verifier
        uses: model-checking/kani-github-action@v0.32
        with:
          args: --workspace --tests # Runs all proofs in the workspace

      - name: Verification Success
        if: success()
        run: echo "✅ Kani Formal Verification Passed!"
